title: "KungfuPanda"
subtitle: "personal notes, tools, and thoughts"
description: "A minimal personal blog for notes, tools, thoughts, and long-term writing."
lang: "en"
timezone: "Asia/Shanghai"
url: "https://kungfupanda0823.github.io"
baseurl: ""
author:
  name: "KungfuPanda"
  bio: "Personal notes, tools, thoughts, and fragments worth revisiting."

permalink: /:categories/:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  pages:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "KungfuPanda"
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .github
